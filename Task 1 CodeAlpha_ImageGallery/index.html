<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CodeAlpha Creative Gallery</h1>

    </button>

    <button class="filter" data-category="bunnies">
       bunnies
    </button>

    <button class="filter" data-category="Crafty Bloom">
       Crafty Bloom
    </button>

</div>

        <div class="gallery">

            <img src="images/image1.png"

    <p>© 2026 CodeAlpha Image Gallery | Frontend Development Internship</p>

<div class="lightbox" id="lightbox">

    <span class="close" id="close">&times;</span>

    <button class="prev" id="prev">&#10094;</button>

    <img id="lightboxImage" src="" alt="Large Gallery Image">

</div>
